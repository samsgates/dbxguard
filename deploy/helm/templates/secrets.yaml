apiVersion: v1
kind: Secret
metadata: {name: "{{ .Release.Name }}-secrets"}
type: Opaque
stringData:
  database-url: {{ required "env.DBXGUARD_DATABASE_URL is required" .Values.env.DBXGUARD_DATABASE_URL | quote }}
  redis-url: {{ required "env.DBXGUARD_REDIS_URL is required" .Values.env.DBXGUARD_REDIS_URL | quote }}
  secret-key: {{ required "env.DBXGUARD_SECRET_KEY is required" .Values.env.DBXGUARD_SECRET_KEY | quote }}
