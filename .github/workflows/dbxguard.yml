name: DBXGuard
on: [pull_request]
permissions: {contents: read, id-token: write}
jobs:
  dbxguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install .
      - run: dbxguard git-diff "${{ github.event.pull_request.base.ref }}" --environment production
